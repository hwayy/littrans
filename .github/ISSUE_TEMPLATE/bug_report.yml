name: Bug report
description: Report a reproducible problem in LitTrans
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not upload source PDFs, translations, credentials, or private project data.
  - type: input
    id: version
    attributes:
      label: LitTrans version
      placeholder: 0.5.0
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options: [Codex, Cursor, Direct CLI]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide sanitized commands and data only.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Windows, Python, Codex or Cursor versions as relevant.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed copyrighted source material, translations, credentials, and private project data.
          required: true
