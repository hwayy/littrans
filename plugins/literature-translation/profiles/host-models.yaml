# Recommended role models per coordination host.
#
# `project init` copies this mapping into the project's `project.yaml` under
# `agent_models`. Review and adjust it per project: packets carry the configured
# model/effort and submissions echo them.
#
# Every value is a dispatch value: what the coordinator hands to the host's task
# launcher. Whether that is a category alias or a concrete model id is the host's
# convention, and which model the host serves under it is the host's own
# configuration (a Claude Code alias may be routed to any provider). The plugin
# never verifies a dispatched subagent's model; a writer may record what its
# environment reports in the submission's `served_model_label`, unverified.
#
# Roles: `translate` (target-prose writer, also used for `revise`), `transcribe`
# (structured asset candidate author), `audit` (the three translation lenses),
# `asset-audit` (independent candidate review) and `source-review` (page-by-page
# review and correction of prepared source). Each role sets its own `model` and
# `reasoning_effort`; neither is shared across roles.
#
# Leaving a role, a model or an effort unset is supported: that dispatch then
# follows the host's own default subagent behaviour. The CLI reports the mismatch
# as an advisory — on stderr, in `workflow next`/`status` and in `project models` —
# and never refuses a packet over it. Codex takes both a per-dispatch model and a
# per-dispatch effort; Claude Code takes a model only, and its effort comes from the
# `effort: high` frontmatter every LitTrans agent declares (a configured Claude
# effort is not applied and is reported); Cursor and Qoder take neither, so their
# own policy decides.
#
# The legacy flat form (a bare model string per role plus one host-level
# `reasoning_effort`) is still read and normalized into this shape.
codex:
  translate:
    model: gpt-6-luna
    reasoning_effort: max
  transcribe:
    model: gpt-6-luna
    reasoning_effort: max
  audit:
    model: gpt-6-sol
    reasoning_effort: high
  asset-audit:
    model: gpt-6-sol
    reasoning_effort: high
  source-review:
    model: gpt-6-sol
    reasoning_effort: high
claude:
  # Claude Code model alias passed to the Agent tool's `model` parameter. Effort is
  # not a dispatch value here: the agents' `effort: high` frontmatter applies.
  translate:
    model: sonnet
  transcribe:
    model: sonnet
  audit:
    model: sonnet
  asset-audit:
    model: sonnet
  source-review:
    model: sonnet
cursor: {}  # No per-dispatch model selection on this host; configure it per project if the host gains one.
qoder: {}  # No per-dispatch model selection on this host; configure it per project if the host gains one.
